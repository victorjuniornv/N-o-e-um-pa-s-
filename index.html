<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Meu Brasil 3D</title><link rel="stylesheet" href="/src/style.css"></head><body><div id="game"></div><header><b>🇧🇷 MEU BRASIL 3D</b><span id="status">Demonstração local</span></header><section class="panel search"><label>Estado</label><select id="state"><option>PE</option><option>SP</option><option>RJ</option><option>BA</option><option>MG</option><option>CE</option><option>PR</option><option>RS</option><option>AM</option><option>GO</option><option>DF</option><option>PA</option></select><label>Cidade</label><input id="city" value="Garanhuns" maxlength="60"><button id="find">Encontrar cidade</button></section><section class="panel house"><h3>🏡 Minha casa</h3><label>Nome da casa</label><input id="house" maxlength="45" placeholder="Casa do Major"><label>Seu nome</label><input id="player" maxlength="24" placeholder="Jogador"><button id="save">Colocar / atualizar casa</button><p id="count">Casas: 1</p><small>Arraste a tela para girar; use pinça para zoom.</small></section><div id="toast"></div><script type="module" src="/src/main.js"></script></body></html>
